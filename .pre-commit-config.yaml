# Hooks locales: los errores se cazan antes del push, no en CI.
#   Instalar una vez:  uv run pre-commit install
#   Correr a mano:     uv run pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      # CLAUDE.md §3 R5 — última línea de defensa contra secretos commiteados.
      - id: detect-private-key
      - id: check-case-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.0
    hooks:
      - id: mypy
        files: ^(src|scripts)/
        additional_dependencies:
          - pydantic>=2.9
          - pydantic-settings>=2.6
